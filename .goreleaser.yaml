version: 2

project_name: costblame

before:
  hooks:
    - go mod tidy

builds:
  - id: costblame
    main: ./cmd/costblame
    binary: costblame
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -s -w
      - -X github.com/prem0x01/costblame/internal/version.Version={{.Version}}
      - -X github.com/prem0x01/costblame/internal/version.Commit={{.ShortCommit}}
      - -X github.com/prem0x01/costblame/internal/version.Date={{.Date}}

archives:
  - id: costblame
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - costblame.example.yaml
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"

  - image_templates:
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"

docker_manifests:
  - name_template: "ghcr.io/prem0x01/costblame:{{ .Tag }}"
    image_templates:
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-amd64"
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/prem0x01/costblame:latest"
    image_templates:
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-amd64"
      - "ghcr.io/prem0x01/costblame:{{ .Tag }}-arm64"

release:
  github:
    owner: prem0x01
    name: costblame
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    **Full Changelog**: https://github.com/prem0x01/costblame/compare/{{ .PreviousTag }}...{{ .Tag }}
